[Service]
# Memory containment for zikzak-liquidsoap. Raised for Liquidsoap 2.5.0:
# multithreaded decode (~190 threads + 4 per-output clocks + per-channel raw
# buffers) legitimately exceeds the 2.2.4-era ~500MB baseline, and the old 2G
# MemoryHigh was reclaim-throttling the working set (it sat pinned at 2.0G).
# MemoryMax=6G still OOM-kills a true runaway (the 2026-08 freeze hit 7.8G)
# well before it can thrash the 16G box. See docs/troubleshooting.md and
# zikzak/liquidsoap/README-liquidsoap-2.5.md.
MemoryHigh=4G
MemoryMax=6G
